<!DOCTYPE html>
<!-- `data-theme` server (`fill_html`) bharta hai â€” JS nahi, warna pehle frame
     par flash. Ab sirf "gold"; whitelist `config.HUD_THEMES` me hai. -->
<html lang="en" data-theme="__JARVIS_HUD_THEME__">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="jarvis-token" content="__JARVIS_TOKEN__" />
<meta name="jarvis-tools" content="__JARVIS_TOOLS_ON__" />
<!-- Naam config se aata hai (config_name.py). JS bhi yahin se padhta hai, is
     liye "Jarvis" app.js / hud_*.js me dobara likha nahi gaya. -->
<meta name="jarvis-name" content="__JARVIS_ASSISTANT_NAME__" />
<meta name="jarvis-display" content="__JARVIS_DISPLAY_NAME__" />
<meta name="jarvis-theme" content="__JARVIS_HUD_THEME__" />
<title>__JARVIS_ASSISTANT_NAME__ HUD</title>
<link rel="stylesheet" href="/ui/fonts.css" />
<link rel="stylesheet" href="/ui/hud_base.css" />
<link rel="stylesheet" href="/ui/hud_panel.css" />
<link rel="stylesheet" href="/ui/hud_left.css" />
<link rel="stylesheet" href="/ui/hud_center.css" />
<link rel="stylesheet" href="/ui/hud_right.css" />
<link rel="stylesheet" href="/ui/hud_bottom.css" />
<link rel="stylesheet" href="/ui/hud_card.css" />
</head>
<body>
<div class="gridbg" aria-hidden="true"></div>
<main class="hud">

  <header class="topbar">
    <div class="tb-left">
      <h1 class="brand" id="brand">__JARVIS_DISPLAY_NAME__</h1>
      <span class="pill st-idle" id="status">â— IDLE</span>
    </div>
    <div class="tb-mid">
      <div class="ruler" id="ruler" aria-hidden="true"></div>
      <!-- KAAM A: brainwarn ab topbar ke apne flow me hai. -->
      <p class="brainwarn" id="brainwarn">__JARVIS_BRAIN_WARN__</p>
    </div>
    <div class="tb-right">
      <span class="pill sys" id="sysstate">SYSTEM â€¦</span>
      <span class="pill desk off" id="deskstate">DESKTOP â€¦</span>
      <span class="prov" id="provider"></span>
      <button class="mini" id="mute" type="button">MUTE</button>
      <button class="mini" id="stop" type="button">STOP</button>
      <button class="mini" id="kill" type="button">TOOLS OFF</button>
    </div>
  </header>

  <aside class="col-left">
    <section class="panel" id="p-clock">
      <h2 class="ptab">CHRONOMETER</h2>
      <div class="clockrow">
        <div class="dial">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle class="dial-bg" cx="50" cy="50" r="44" />
            <circle class="dial-fg" id="dialSec" cx="50" cy="50" r="44" />
          </svg>
          <span class="dial-num" id="clockSec">00</span>
        </div>
        <div class="clocktext">
          <p class="bigtime" id="clockTime">--:--</p>
          <p class="tiny" id="clockDate">â€¦</p>
        </div>
      </div>
    </section>

    <section class="panel" id="p-system">
      <h2 class="ptab">SYSTEM</h2><span class="tag">LIVE</span>
      <div class="gauges" id="gauges"></div>
      <div class="bars" id="bars"></div>
    </section>

    <section class="panel grow" id="p-activity">
      <h2 class="ptab">ACTIVITY</h2>
      <div class="actlist" id="activity"></div>
    </section>
  </aside>

  <section class="col-center">
    <!-- Golden plasma orb: sphere + donut core + arcs + filaments. Gradients
         SVG me CSS se nahi bante, is liye defs yahan. State class JS lagata hai. -->
    <div class="orbwrap" id="orbwrap">
      <svg class="orb" id="orb" viewBox="0 0 320 320" role="img" aria-label="Jarvis orb">
        <defs>
          <radialGradient id="plasmaGrad" cx="42%" cy="36%" r="70%">
            <stop offset="0%" stop-color="#ffe9b0" stop-opacity="0.55" />
            <stop offset="34%" stop-color="#ffb43a" stop-opacity="0.28" />
            <stop offset="70%" stop-color="#6b4713" stop-opacity="0.55" />
            <stop offset="100%" stop-color="#0d0906" stop-opacity="0.94" />
          </radialGradient>
          <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffe9b0" />
            <stop offset="45%" stop-color="#ffb43a" />
            <stop offset="100%" stop-color="#c8842a" />
          </linearGradient>
          <linearGradient id="sheenGrad" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#ffe9b0" stop-opacity="0" />
            <stop offset="100%" stop-color="#ffe9b0" stop-opacity="0.85" />
          </linearGradient>
        </defs>
        <g id="ringOuter"></g>
        <circle class="segtrack" cx="160" cy="160" r="132" />
        <circle class="seg" id="ringSeg" cx="160" cy="160" r="132" />
        <circle class="progtrack" cx="160" cy="160" r="106" />
        <circle class="prog" id="ringProg" cx="160" cy="160" r="106" />
        <circle class="arc arcA" cx="160" cy="160" r="124" />
        <circle class="arc arcB" cx="160" cy="160" r="116" />
        <circle class="arc arcC" cx="160" cy="160" r="96" />
        <circle class="sphere" cx="160" cy="160" r="84" />
        <!-- specular highlight: sphere ke upar-baayin 70Â° ka arc -->
        <path class="sheen" d="M78.9 138.3 A84 84 0 0 1 152.7 76.3" />
        <circle class="fil" cx="160" cy="160" r="74" />
        <circle class="fil f2" cx="160" cy="160" r="68" />
        <circle class="fil f3" cx="160" cy="160" r="62" />
        <circle class="fil f4" cx="160" cy="160" r="56" />
        <circle class="dotted" id="ringDot" cx="160" cy="160" r="79" />
        <circle class="core" id="ringCore" cx="160" cy="160" r="48" />
        <g class="satorbit satA"><circle class="sat" cx="160" cy="20" r="2.6" /></g>
        <g class="satorbit satB"><circle class="sat" cx="160" cy="42" r="2" /></g>
      </svg>
      <div class="orbtext">
        <p class="orbmode" id="orbMode">__JARVIS_DISPLAY_NAME__</p>
        <p class="orbstate" id="orbState">READY</p>
      </div>
    </div>
    <p class="orbline" id="orbLine"></p>
  </section>

  <aside class="col-right">
    <section class="panel" id="p-weather">
      <h2 class="ptab">WEATHER</h2>
      <div class="wxrow">
        <svg class="tempdial" viewBox="0 0 120 66" aria-hidden="true">
          <path class="t-track" d="M12 60 A48 48 0 0 1 108 60" />
          <path class="t-fg" id="tempArc" d="M12 60 A48 48 0 0 1 108 60" />
        </svg>
        <div class="wxtext">
          <p class="wxtemp" id="wxTemp">--Â°</p>
          <p class="wxcond" id="wxCond">No data</p>
          <p class="tiny" id="wxCity">Delhi</p>
        </div>
      </div>
      <p class="hint" id="wxHint"></p>
    </section>

    <section class="panel grow" id="p-chat">
      <h2 class="ptab">CONVERSATION</h2>
      <div class="chatlog" id="messages"></div>
    </section>
  </aside>
  <!-- BOTTOM BAR (KAAM A: .notice/.micflag bar ke apne .barhint row me) -->
  <footer class="bottombar">
    <div class="barhint">
      <div class="remind-pill" id="remindPill"></div>
      <p class="notice" id="notice"></p>
      <p class="micflag" id="micflag">MIC ON</p>
    </div>
    <div class="qgroup" id="qLeft"></div>
    <div class="composer">
      <button class="mic" id="mic" type="button" title="Mic on/off">
        <span class="micdot"></span><span class="mictx">MIC</span>
      </button>
      <input id="cmd" type="text" autocomplete="off" maxlength="2000"
             placeholder="Command likhiye, sir..." />
      <button id="send" type="button">SEND</button>
    </div>
    <div class="qgroup" id="qRight"></div>
  </footer>
</main>
<!-- Trust mode me ye card kabhi nahi khulta; trust off par purana ALLOW/DENY. -->
<div class="overlay" id="confirmcard" hidden>
  <div class="card">
    <h3>ALLOW YA DENY?</h3>
    <p class="cardtool" id="cardtool"></p>
    <pre class="carddetail" id="carddetail"></pre>
    <div class="cardrow">
      <button id="deny" type="button">DENY</button>
      <button id="allow" type="button">ALLOW</button>
      <span class="count" id="cardcount">60s</span>
    </div>
  </div>
</div>
<script src="/ui/recorder.js"></script>
<script src="/ui/speaker.js"></script>
<script src="/ui/hud_clock.js"></script>
<script src="/ui/hud_stats.js"></script>
<script src="/ui/hud_prime.js"></script>
<script src="/ui/hud_activity.js"></script>
<script src="/ui/hud_status.js"></script>
<script src="/ui/hud_orb.js"></script>
<script src="/ui/hud_weather.js"></script>
<script src="/ui/hud_quick.js"></script>
<script src="/ui/hud_desktop.js"></script>
<script src="/ui/hud_conn.js"></script>
<script src="/ui/tools.js"></script>
<script src="/ui/voice_ui.js"></script>
<script src="/ui/app.js"></script>
</body>
</html>
